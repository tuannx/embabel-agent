name: Arcade Architecture Analysis

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: Arcade Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Run arcade-agent architecture analysis
        uses: arcade-agent/arcade-agent/actions/analyze@v0.4.1
        with:
          arcade-agent-version: "0.4.1"
          source-path: "."
          languages: "java,kotlin"
          repo-name: "embabel-agent"
          run-secondary-analyses: "false"
          post-pr-comment: "true"
